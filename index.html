<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earth-Sun Orbital Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toggle-wrap">
    <span class="toggle-label" id="label-geo">天動</span>
    <button id="toggle-btn" aria-label="Toggle geocentric / heliocentric"><span class="thumb"></span></button>
    <span class="toggle-label active" id="label-helio">地動</span>
  </div>
  <canvas id="canvas"></canvas>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
